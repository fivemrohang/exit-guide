<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>엑시트 가이드</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');

  :root{
    --bg: #0a0a0c;
    --panel: #0d0d10;
    --border: #1e1e22;
    --text: #f2f2f3;
    --text-dim: #9a9aa0;
    --text-faint: #5c5c62;
    --chip-bg: #131316;
    --chip-active-bg: #1c1c21;
    --hover-bg: #131316;
    --mark-bg: #4a3b12;
    --mark-text: #ffd876;
  }

  html[data-theme="light"]{
    --bg: #ffffff;
    --panel: #fafafa;
    --border: #e7e7e9;
    --text: #16161a;
    --text-dim: #62626a;
    --text-faint: #97979f;
    --chip-bg: #f3f3f4;
    --chip-active-bg: #ececee;
    --hover-bg: #f3f3f4;
    --mark-bg: #fff1b8;
    --mark-text: #6b4e00;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100%;
    transition: background .2s, color .2s;
  }

  a{ color: inherit; text-decoration: none; }
  button{ font-family: inherit; }

  mark{
    background: var(--mark-bg);
    color: var(--mark-text);
    border-radius: 3px;
    padding: 0 1px;
  }

  /* ---------- Top Nav ---------- */
  .topbar{
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 20;
  }

  .topbar-left{
    display:flex;
    align-items:center;
    gap: 10px;
  }

  .logo{
    width: 26px;
    height: 26px;
    object-fit: contain;
    display:block;
  }

  .brand{
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.2px;
  }

  /* ---------- Theme toggle ---------- */
  .theme-toggle{
    display:flex;
    align-items:center;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px;
    gap: 2px;
  }

  .theme-opt{
    display:flex;
    align-items:center;
    gap: 6px;
    padding: 7px 16px;
    border-radius: 17px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-faint);
    cursor: pointer;
    border: none;
    background: transparent;
    transition: background .15s, color .15s;
  }

  .theme-opt svg{ opacity: .7; }

  .theme-opt.active{
    background: var(--chip-active-bg);
    color: var(--text);
  }

  html[data-theme="light"] .theme-opt.active{
    background: #ffffff;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  .topbar-right{ width: 148px; } /* spacer to keep toggle visually centered */

  /* ---------- Layout ---------- */
  .layout{
    display:flex;
    min-height: calc(100vh - 64px);
  }

  .sidebar{
    width: 258px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 22px 18px;
    position: relative;
  }

  .search-wrap{ position: relative; margin-bottom: 22px; }

  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
  }

  .search-box svg{ flex-shrink:0; opacity:.5; }

  .search-box input{
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 13px;
    width: 100%;
    font-family: inherit;
  }
  .search-box input::placeholder{ color: var(--text-faint); }

  .kbd{
    font-size: 11px;
    color: var(--text-faint);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    flex-shrink:0;
  }

  .search-clear{
    display:none;
    background:none;
    border:none;
    color: var(--text-faint);
    cursor:pointer;
    padding: 2px;
    flex-shrink:0;
  }
  .search-clear:hover{ color: var(--text); }

  .search-results{
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    max-height: 420px;
    overflow-y: auto;
    box-shadow: 0 16px 32px rgba(0,0,0,.4);
    display: none;
    z-index: 30;
  }

  .search-results.open{ display:block; }

  .sr-count{
    font-size: 11px;
    font-weight: 700;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: .5px;
    padding: 6px 8px;
  }

  .sr-item{
    display:block;
    padding: 8px 8px;
    border-radius: 7px;
    cursor: pointer;
  }
  .sr-item:hover{ background: var(--hover-bg); }

  .sr-title{
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .sr-cat{
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-faint);
    margin-bottom: 3px;
  }

  .sr-snippet{
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .sr-empty{
    padding: 18px 8px;
    text-align:center;
    font-size: 12.5px;
    color: var(--text-faint);
  }

  .nav-group{ margin-bottom: 4px; }

  .nav-group-title{
    display:flex;
    align-items:center;
    gap:6px;
    padding: 8px 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    user-select:none;
    background: none;
    border: none;
    color: var(--text);
    width: 100%;
    text-align: left;
  }

  .nav-group-title svg{ opacity: .6; transition: transform .18s ease; flex-shrink:0; }
  .nav-group.collapsed .nav-group-title svg{ transform: rotate(-90deg); }

  .nav-sub-wrap{
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows .18s ease;
  }
  .nav-group.collapsed .nav-sub-wrap{ grid-template-rows: 0fr; }

  .nav-sub{
    display:flex;
    flex-direction:column;
    overflow: hidden;
    min-height: 0;
  }

  .nav-sub button{
    display:flex;
    align-items:center;
    gap:6px;
    padding: 7px 8px 7px 22px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-dim);
    border-radius: 6px;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
  }

  .nav-sub button svg{ opacity: .45; flex-shrink:0; }

  .nav-sub button:hover{ color: var(--text); background: var(--hover-bg); }

  .nav-sub button.active{
    color: var(--text);
    background: var(--chip-active-bg);
  }
  .nav-sub button.active svg{ opacity: .9; }

  .nav-group + .nav-group{
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .nav-law-item{ width:100%; }
  .nav-law-title{
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 8px 7px 22px;
    font-size:13.5px;
    font-weight:600;
    color:var(--text-dim);
    border-radius:6px;
    background:none;
    border:none;
    width:100%;
    text-align:left;
    cursor:pointer;
  }
  .nav-law-title svg{ opacity:.45; flex-shrink:0; transition:transform .18s ease; }
  .nav-law-item.collapsed .nav-law-title svg{ transform:rotate(-90deg); }
  .nav-law-sub-wrap{ display:grid; grid-template-rows:1fr; transition:grid-template-rows .18s ease; }
  .nav-law-item.collapsed .nav-law-sub-wrap{ grid-template-rows:0fr; }
  .nav-law-sub-wrap .nav-sub{ min-height:0; overflow:hidden; }
  .nav-law-sub-wrap .nav-sub button{ padding-left:38px; }

  /* ---------- Main content ---------- */
  .content{
    flex:1;
    padding: 56px 64px;
    max-width: 840px;
  }

  .content h1{
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 12px;
    letter-spacing: -.5px;
  }

  .content .eyebrow{
    font-size: 12px;
    font-weight: 700;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: .6px;
    margin-bottom: 10px;
  }

  .content .body-text{
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--text-dim);
    white-space: normal;
  }

  .content .body-text:not(:empty){ margin-top: 18px; }

  .body-text table{ width: 100%; border-collapse: collapse; margin-top: 16px; margin-bottom: 16px; font-size: 13.5px; }
  .body-text th, .body-text td{ border: 1px solid var(--border); padding: 10px 12px; text-align: left; vertical-align: top; }
  .body-text th{ background: var(--chip-bg); font-weight: 700; color: var(--text); }
  .body-text ul, .body-text ol{ padding-left: 20px; margin: 10px 0; }
  .body-text li{ margin-bottom: 4px; }
  .body-text hr{ border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
  .body-text h1{ font-size: 24px; font-weight: 800; margin: 24px 0 12px 0; color: var(--text); }
  .body-text h2{ font-size: 20px; font-weight: 700; margin: 20px 0 10px 0; color: var(--text); }
  .body-text h3{ font-size: 17px; font-weight: 700; margin: 18px 0 8px 0; color: var(--text); }
  .body-text h4{ font-size: 15px; font-weight: 700; margin: 14px 0 6px 0; color: var(--text); }
  .body-text p{ margin: 8px 0; }

  @media (max-width: 860px){
    .sidebar{ display:none; }
    .content{ padding: 40px 24px; }
    .theme-opt span{ display:none; }
    .topbar-right{ display:none; }
  }

/* Discord embed-style neutral hint boxes */
.md-content .hint,
.md-content blockquote.hint,
.md-content .hint.info,
.md-content .hint.warning,
.md-content .hint.danger,
.md-content .hint.success,
.md-content [class*="hint-"] {

  border: 1px solid var(--border, rgba(255,255,255,.10)) !important;
  border-left: 3px solid var(--border, rgba(255,255,255,.16)) !important;
  box-shadow: none !important;
  color: inherit !important;
}

.md-content .hint::before,
.md-content blockquote.hint::before,
.md-content [class*="hint-"]::before {
  background: transparent !important;
  color: inherit !important;
}

.md-content .hint h1,
.md-content .hint h2,
.md-content .hint h3,
.md-content .hint h4,
.md-content .hint p,
.md-content .hint li,
.md-content [class*="hint-"] h1,
.md-content [class*="hint-"] h2,
.md-content [class*="hint-"] h3,
.md-content [class*="hint-"] h4,
.md-content [class*="hint-"] p,
.md-content [class*="hint-"] li {
  color: inherit !important;
}


/* FINAL: neutral Discord-style embeds — remove all category colors */
.md-content .hint,
.md-content .hint-info,
.md-content .hint-warning,
.md-content .hint-danger,
.md-content .hint-success,
.md-content [class^="hint-"],
.md-content [class*=" hint-"],
#content .hint,
#content [class^="hint-"],
#content [class*=" hint-"],
.hint,
.hint-info,
.hint-warning,
.hint-danger,
.hint-success,
[class^="hint-"],
[class*=" hint-"] {
  background-color: rgba(255,255,255,.035) !important;
  background-image: none !important;
  border-color: rgba(255,255,255,.10) !important;
  border-left-color: rgba(255,255,255,.16) !important;
  color: inherit !important;
  box-shadow: none !important;
}

.md-content .hint::before,
.md-content .hint::after,
#content .hint::before,
#content .hint::after,
.hint::before,
.hint::after,
[class^="hint-"]::before,
[class^="hint-"]::after,
[class*=" hint-"]::before,
[class*=" hint-"]::after {
  background: transparent !important;
  border-color: transparent !important;
  color: inherit !important;
}

.md-content .hint *,
#content .hint *,
.hint *,
[class^="hint-"] *,
[class*=" hint-"] * {
  border-left-color: inherit !important;
}

</style>
</head>

<ol><li>모든 형법은 공소시효의 기준은 범죄가 발생 한 시점으로부터 2시간이다. 범죄 발생 후 2시간 안으로 신고해야 법적 효력이 발생하며 2시간 이후 신고하는 경우 법적 효력이 없다.</li><li>서버가 리부팅 전 발생한 범죄 또한 법적 효력이 없다.</li></ol>
<h3>제 20장 불법 물건 및 무기</h3>
<h4>제 44조</h4>
<ol><li>불법 물건 소지 시 벌금 80.000.000원 구금 20분에 처한다</li><li>불법 무기 소지 시 벌금 150.000.000원 구금 20분에 처한다</li><li>불법 물건/무기를를 은어 사용 없이 음성,채팅, 광고에 언급하는 경우 벌금 100.000.000원 구금 20분에 처한다.</li></ol>
<h3>제 21장 국유지 사유지 무단침입</h3>
<h4>제 45조</h4>
<ol><li>공무원의 퇴거 요청을 무시하고 1번이상 국유지를 무단 침입하는 경우 벌금 200.000.000원 구금 30분에 처한다.</li><li>3번이상 국유지 무단 침입 및 누가봐도 계속 지속적으로 RP 유도 시 관리자 처벌 진행된다.</li></ol>
<h3>제 22장 뺑소니</h3>
<h4>제 46조</h4>
<ol><li>운전자가 교통사고를 낸 후 피해자에 대해 적절한 조치 없이 도주하는 경우 벌금 100.000.000원 구금 20분에 처한다.</li></ol>
<h3>제 23장 항공법</h3>
<h4>제 47조</h4>
<ol><li>저공비행을 하는 자는 벌금 300.000.000원 구금 40분에 처한다.</li></ol>
<div class="hint hint-warning"><p>저공 비행의 기준은 메이즈 타워 높이보다 낮을 경우로 간주한다.</p></div>
<ol><li>무허가 항공기를 운행하는 자는 벌금 150,000,000원 구금 30분에 처한다.</li><li>경찰청, 보안국 등이 허가할 수 있는 최대 비행시간은 60분으로 제한한다</li><li>헬기 허가 요청 시 각 관할 경찰, 보안국에게 운전자 및 동승자 정보를 전달하여 허가 요청하여야 한다.</li><li>헬기 운행 허가 요청 시 동승자에 기록하지 않은 인원이 탑승한 경우, 탑승자 전원(허가 받은 인원이더라도) 무허가 항공기 운행 처벌받는다.</li></ol>
<h3>제 24장 도로교통법 & 중범죄 & 방조 및 공범죄</h3>
<h4>제 48조 </h4>
<ol><li>도로 교통법 및 중범죄 및 방조 공범죄는 공무원 벌금표에서 확인할 수 있다.</li><li>방조 및 공범죄에서 형법 위반으로 운전자가 구금될 경우, 동승자 및 같이 있던 일행도 방조 또는 공범에 해당하여 동일한 구금에 처한다.</li><li>운전자는 도주하고, 동승자만 체포된 경우 동승자부터 처벌 후 도주한 운전자에 대해 수배 RP를 진행할 수 있다.</li></ol>
<h3>제 25장 미란다 고지 및 구금 집행</h3>
<h4>제 49조</h4>
<ol><li>미란다 고지는 체포 후 차량에 태우기 전까지만 고지하면 된다</li><li>4인용 차인 경우, 끌고가기한 상태에서 차량에 탑승시킬 수 없고 끌고가기를 해제한 후 차량에 탑승시켜야 한다.</li><li>구금을 집행할 경우, 끌고가기한 상태에서 집행할 수 없다.</li><li>스토리, 강도 RP를 제외한 모든 구금 집행은 유치장에서 해야 한다.</li><li>즉흥, 영장 RP 한하여 공무원 재량하에 최초 수배자 외 현장 또는 유치장 집행이 가능하다.</li></ol>`,

    'server-law-child-0': `<h1>보호구역 법률</h1>

    'server-law-child-5': `<h1>통합 RP 법률</h1>
<div style="border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:12px 16px;margin:12px 0;background:rgba(255,255,255,.035);"><h2>통합 RP 법률은 스토리 RP 법률에 의거해 진행될 수 있습니다.</h2><ul><li>1. 법률에 없는 내용이라고 하여도 이를 고의적으로 사용했다고 사건처리 담당자가 판단 시 관리자 처벌 진행될 수 있음을 알려드립니다.</li><li>2. 법률에 없는 내용에 대해선법률 건의에 남겨주시고 RP 전 궁금하신 부분은 고객센터로 남겨주세요.</li><li>3. 법률에 없는 내용에 대해선 사건처리 담당자의 판단 하에 추가진행 될 수 있음을 알려드립니다.</li></ul></div>
<h3>통합 기본 RP  규정안내</h3>
<ul><li>모든 RP는 관리자 판단에 따라 중단되거나 무효 처리(없알)될 수 있다.</li><li>RP 중 디컨이 발생했을 경우, 10분 이내 복귀하지 않으면 관리자 제재 대상이 될 수 있다.</li><li>타당한 사유 없이 알피를 거부할 수 없다.</li><li>RP 중단은 명확한 사유가 있어야 하며, 단순 핑 차이는 중단 사유로 인정되지 않는다.</li></ul>
<div style="border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:12px 16px;margin:12px 0;background:rgba(255,255,255,.035);"><ul><li>관리자 판단하에 심한 핑 문제일 경우 재RP가 진행될 수 있다.</li><li>심한 핑차이란 텔포, 투명한 벽, 벽을 뚫는 행위를 뜻한다.</li><li>재RP 이후에도 동일한 문제가 반복되면 해당 RP는 없알 처리된다.</li><li>합당한 사유 없이 중단할 경우 관리자 제재가 적용될 수 있다.</li></ul></div>
<ul><li>RP 중단 시점은 채팅 기준으로 판단하며, 중단 당시 사망자는 살고 진행할 수 있다. 단, 엇각으로 인한 중단이며 가해자 시점이 1인칭일 경우 사망자는 그대로 진행한다. (핑 문제로 간주)</li></ul>
<div style="border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:12px 16px;margin:12px 0;background:rgba(255,255,255,.035);"><ul><li>피해자 영상에서 머리가 완전히 보이지 않을 경우 엇각으로 인정한다.</li><li>피해자 기준 머리가 일부라도 보이지 않는 장면이 확인되어야 가해자 영상 확인이 가능</li></ul></div>
<ul><li>RP 중단 시 캐릭터는 중단 선언 시점의 위치에서 정지해야 한다.</li><li>정당하지 않은 이유로 중단했을 경우, 패알 처리된다. (모든 사유 동일)</li></ul>
<div style="border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:12px 16px;margin:12px 0;background:rgba(255,255,255,.035);"><ul><li>특별한 사유가 있을 경우, 관리자에게 허가받은 후 최대 2시간까지 중단 가능하다.</li><li>공무직 팩션의 경우, 알피 중단/해제 시 사이드 공지 및 외부 공지를 통해 알려야 한다.</li><li>조직 팩션의 경우, 최소 30분전에 외부 공지를 통해 알려야 한다.</li></ul></div>
<ul><li>강도 RP에서 강도 측이 패배했더라도 공무원은불법 물품(마약/검은돈 등)을 압수하여 개인소지 할 수 없다.</li></ul>
<div style="border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:12px 16px;margin:12px 0;background:rgba(255,255,255,.035);"><ul><li>시간 초과 등으로 획득한 보석 또는 검은돈은 버리거나 스태프 호출 후 반납해야 한다.</li><li>반납하지 않을 경우 관리자 제재가 적용된다.</li><li>만약 공무원 측에서 압수 후 버리지 않을 경우 적발시 관리자 제제처리 진행</li></ul></div>
<ul><li>보석금은 1분당 300만원이며 관리자 구금은 보석금 사용이 불가하다.</li><li>RP 중 재장전 없이 총기를 교체하는 행위(장전 스킵)는 금지된다</li><li>구르기 스킵을 금지한다.</li><li>서버 내 시스템(킬 로그)을 이용해 RP를 진행하는 행위는 금지된다.</li><li>조직 RP의 경우, 쿨타임을 반드시 기록해야 한다.</li><li>모든 RP에서 인간형이 아닌 스킨(꼬마 캐릭터 포함)과 치장 착용은 금지된다.</li></ul>
<div style="border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:12px 16px;margin:12px 0;background:rgba(255,255,255,.035);"><ul><li>인간형이 아닌 스킨 착용 후 차량을 탑승하는 행위는 가능하지만, 공무 집행 중인 경찰/보안국 지시에 따라야 하며, 도주를 금지한다.</li></ul></div>
<ul><li>RP 중 사건처리담당자가 선임되면 해당 RP는 자동으로 중단 상태로 전환된다.</li></ul>
<div style="border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:12px 16px;margin:12px 0;background:rgba(255,255,255,.035);"><ul><li>스토리 RP/조직RP의 경우, 사건처리담당자 선임 후 관리자 처리가 있을 경우 해당 알피는 없알 처리된다.</li><li>필드RP에서 관리자 처리가 있을 경우, 처벌 대상 제외한 인원은 재알 또는 부분재알 처리된다.</li><li>법률 위반이 확인된 경우 관리자 선임 전 상호간 합의 후 피의자측의 패배로 처리할 수 있다.</li></ul></div>
<ul><li>리붓 공지 이후에는 새로운 RP를 시작할 수 없다. ( 리붓공지 이전 진행하던 RP 제외 )</li><li>RP 중 진통제와 방탄복은 개수 제한 없이 사용할 수 있다.</li><li>RP 중 비콘 사용은 금지된다. (일부 조직 RP는 예외)</li><li>RP 구역을 벗어나거나 금지 구역에서 발포할 경우 패배 처리된다. (일부 조직 RP는 사망 처리)</li><li>즉흥/수배 RP에서 도주자 또는 수배자가 패배한 경우 범죄 행위에 대한 가중처벌과 불법무기 및 불법 물건 압수 가능하다.</li><li>RP에서 전멸 후 중단 불가하다. 단, 전멸 이후 NON-RP가 확인될 경우 중단이 가능하다.</li><li>모든 RP 시 화면공유를 금지한다.</li><li>RP진행 시 능력치에 버프를 주는 음식 섭취를 금지한다.</li><li>사후 브리핑(마지막 본인 시점 브리핑은 가능)을 금지합니다.(적발 시 패배 처리)</li></ul>
<div style="border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:12px 16px;margin:12px 0;background:rgba(255,255,255,.035);"><p>사후 브리핑의 기준은 상황 오더, 상대방 위치 브리핑 등 RP에 직접적인 영향이 갈 수 있는 발언을 기준으로 한다.</p></div>
<ul><li>버그 차로 RP 진행을 금지한다.</li><li>RP 중 Q엄폐 사용은 불가능하다. (일부 스토리RP제외)</li><li>강도측은 스토리RP(은행/ATM/편의점/보석상) 공무원 허가 시 1분 이내로 RP 벨을 울려야 한다.(모든 인원이 RP 준비가 안된 상태로 공표 금지)</li></ul>
<div style="border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:12px 16px;margin:12px 0;background:rgba(255,255,255,.035);"><ul><li>공표는 모든 RP 참여 인원이 RP 장소에 도착한 후 진행되여야 한다.</li><li>RP장소에 먼저 도착했더라도 공표를 안한 상태라면 공표한 사람이 RP 우선권을 갖는다.</li></ul></div>
<ul><li>경찰/보안국 합동RP는 대형 RP(남부은행/북부은행)와 영장RP만 가능하다.</li><li>스토리 RP 종료 후 강도 패배 시 사망자리 이탈 및 숨는 행위(RP 거부) / 불법 무기를 돌려놓는 행위(시스템 악용)는 관리자 처벌 대상이다.</li><li>공무원은 차량 번호판 및 머리위 이름 표기로 신원 확인 가능하다.</li><li>공무원은 스토리 RP 전멸 후 사망자를 RP 범위 밖으로 이동시키기 위해 시체 끌기하는 행위는 가능하다.(시간 초과로 인한 보상 획득을 방지하기 위함) / 단 이외 상황에서 RP 중 시체 드래그는 불가하다.</li><li>RP 중 살아있는 상태에서 레그돌을 금지한다.(사망한 인원이 살아난 상태에서 레그돌 하는 행위는 가능)</li><li>엇각/우각/심한 핑차이로 사망하여 중단된 경우, 해당 문제로 인해 사망한 인원만 살아날 수 있다.</li><li>무력진압 전 공무원/시민은 차량 사고, 배고픔, 추락사 등 단순 과실로 인해 사망한 경우 상대측에게 사망자의 고번/닉네임 알리고 소생한 후 RP에 참여할 수 있다. EX ) 태식 무력진압 전 사망으로 소생</li></ul>
<div style="border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:12px 16px;margin:12px 0;background:rgba(255,255,255,.035);"><p>단 , 무력진압 전 같은 강도/공무원 측에게 무기 또는 폭행으로 살해당한 경우 참여 불가</p></div>
<ul><li>강도 패배 시 납부할 벌금을 보유하고 있지 않은 상태로 강도 RP를 진행할 경우 관리자 처벌 진행 된다.</li><li>헬멧을 착용한 상태에서 모든 RP 진행 불가하다, 단 스킨의 제한성으로 인해 공무원 스킨중 헬멧(방탄X) 착용 스킨은 예외</li><li>소형 RP ( 편의점 / 빈집 / ATM ) 는 풀보석금이 가능하다.</li><li>RP 법률을 어길 경우, 상호간 협의를 통해 패알로 진행할 수 있다.(협의가 안될 경우, 관리자 처벌)</li><li>모든 RP에서 특수 총기를 사용하려면 공무원측은 시작 무력진압 또는 허가 이후 강도측은 무력진압전 사용자 공표를 해야 한다 (하지 않을시 RP 패배처리)</li><li>시민 중 동승자는 즉흥/수배/도주 등의 RP가 진행된 경우 영상 확인을 통해 RP에 가담하지 않았을 시 처벌 대상에서 제외될 수 있다.</li><li>모든 RP 참여 시 음성방 (무전방 / 자음방)에 참여해야 한다.</li><li>게릴라,지상 RP 걸린 조직은 지원가는 상황에서 도로교통법에 해당하지 않으나, 남용할 경우 서버 시스템 악용 처벌된다.</li></ul>
<div style="border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:12px 16px;margin:12px 0;background:rgba(255,255,255,.035);"><p>조직은 RP 장소로 이동 중 도로교통법 위반으로 경찰에게 적발되어 정차 요청을 받을 경우, 조직 RP가 진행(또는 예정) 중인 상황임을 전달해야 한다.</p></div>
<ul><li>쿨타임 초기화 전 공표를 금지하며, 공표 시 해당 공표는 무효처리 및 알피 법률 미숙지 처리된다</li><li>RP 공표는 선포하는 측 대표 1명만 진행해야 한다.</li><li>차량을 이용한 RP가 진행 중인 구역에 차량은 도난할 수 없다</li><li>무릎에 앉히는 방식의 탑승은 차량별 허용 정원(인승)을 초과하지 않는 범위에서 허용한다.</li></ul>
<div style="border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:12px 16px;margin:12px 0;background:rgba(255,255,255,.035);"><ul><li>4인승 차량은 무릎 탑승을 포함하여 최대 4인까지만 탑승 가능하며, 이를 초과하는 행위는 금지</li><li>공무원 팩션 2인승 차량은 보조석에 한하여 무릎 탑승을 허용</li><li>운전석 무릎 탑승은 금지한다. 공무 전쟁차량은 제외</li></ul></div>
<ul><li>Q엄폐가 사용 가능한 RP에서 Q엄폐 후 좌클릭 (총만 내밀고 쏘는 사격자세)은 금지</li><li>공무원 측 열감지는 RP 대기장소에서 RP 진입공표후 대표자 한명만 사용 가능하며 반드시 열감지 종료 후 RP 시작을 해야한다.</li><li>모든 RP는 영상녹화는 반드시 필수로 진행되야 한다.</li><li>공무 팩션은 스토리 RP 종료 이후 사유지를 필수적으로 복귀해야 한다.</li><li>모든 스토리 RP 중단은 최대 3번까지만 가능하며 3번 이후는 없알처리 된다. ㄴ 단 법률적인 사건처리를 위한부분은 횟수 제한 X</li><li>도주 / 즉흥 / 수배 / 영장 / 납치 및 청부 의뢰를 제외한 RP에서는 시민 / 조직 / 타팩션 간의 협동RP 가능</li><li>공무 팩션은 알피 종료 후 시체에 수갑을 묶을 수 있으며, 끌고가기를 할 수 있다.</li><li>RP 중 B키 (이동속도증가행위)사용은 금지된다.</li><li>무력진압 후 사망 할 경우 소생 후 RP 재참여는 불가능하며 실수로 살아날 경우 레그돌을 유지해야 한다.</li><li>RP 중 관리자를 선임할 시 자동으로 알피는 중단 처리되며 관리자 선임 이후 유저간의 합의는 불가</li><li>알피 인원 기준은 스코어보드 접속 인원이며, 잠수존 유저는 제외하며 잠수존을 제외한 기타 구역에서의 잠수는 인정X</li><li>중단 사유는 다음과 같은 사유가 아닐 시 인정처리 되지 않으며 중단 시 중단 유저가 영상을 통해 사유를 입증해야 한다. 영상 기준은 피해자 시점</li></ul>
<div style="border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:12px 16px;margin:12px 0;background:rgba(255,255,255,.035);"><ul><li>심한 핑 차이 ( 관리자 판단 하 )</li><li>엇각 / 우각</li><li>모션버그 / 헤드버그 / 경직</li><li>기타 법률에 의거한 법률문제로 인한 중단</li></ul></div>
<ul><li>RP 중 다운은 20초 내로 진행되어야 하며 사망 후 20초 뒤로 다운처리가 안될 시 RP 패배처리 될 수 있다.</li><li>RP 중단은 RP 사망처리 혹은 전멸처리 이전에 진행해야 한다</li><li>모든 RP 에서 중단 중 움직이는 행위는 금지되며 단, 사건 담당 관리자 또는 상대측과의 합의 하에 움직이는 행위는 허용한다</li><li>강도가 스토리 RP 패배 후 집행 받는 과정에서 획득한 검은돈은 강도가 버려야 한다. 단 , 이전에 RP에서 획득했던 검은돈들은 제외된다. + 공무원 팩션은 강도가 버린 후 검은돈을 잘 버렸는지에 대해 확인할 권리가 있다.</li></ul>

    'server-law-child-1': `<h1>서버 제재 법률</h1>

<h2>관리자 구금처리표</h2>

<li>중도 참여 불가</li>
<li>구역 이탈 시 사망처리</li>
<li>지붕 위 금지 / 실수로 올라간 경우, 즉시 내려와야 함</li>
</ul>

<hr>

<h2>3. 진행방법</h2>
<ul>
<li>RP 채팅으로 상대조직명 / 인원 / RP이름을 3번공표한다. → 흑 55 지d ㅅㅍㅈㄱ<br>ㄴ ※ 상대측 최소 인원이 서버에 접속해 있을 때 선포 가능하며, 상대 조직은 인원 부족 시 거절할 수 있다</li>
<li>준비 시간 동안 선포 조직 측 A진영, 상대 조직 B진영에서 대기한다.</li>
<li>준비가 완료되면 선포 조직측에서 RP 카운트를 진행하고 RP를 시작한다.</li>
<li>상대방을 먼저 전멸시키는 측이 승리한다.</li>
</ul>

<hr>

<h2>4. RP 보상 및 벌금</h2>
<ul>
<li>패배 측 : 상대 조직에게 인당 2천만원</li>
</ul>

    'org-rp-law-child-3': `<h2>1. 기본 규칙</h2>
<ul>
<li>RP 가능 인원 : 선포 조직 5명 ~ 10명 / 선포 조직과 동일해야 한다.</li>
<li>사용가능한 무기 : 투척 무기, 샷건, 스나이퍼 제외 모든 무기 사용 가능</li>
<li>진행방식 : 전멸전</li>
<li>제한시간 : 없음</li>
</ul>

<hr>

<h2>2. 유의사항</h2>
<ul>

    'rp-law-child-10': `<h2>1. 기본규칙</h2><ul><li>RP 가능 인원 : 출근 공무원 전체 참여 가능 / 팩션원 전체 참여 가능</li><li>사용 가능 무기 : 샷건 또는 스나이퍼 최대 1명 / 투척무기 제외 스턴건 제외 모든 무기 사용 가능</li><li>제한 시간 : 30분</li></ul><hr>
<h2>2. 유의사항</h2><ul><li>RP 발생 이후 중도 참여 불가능</li><li>타 팩션과 합동 RP 불가능</li><li>사유지 구역 내 차량을 소환하여 진입이 불가하도록 경로를 막는 행위 금지</li><li>Q엄폐 사용 불가능</li><li>엇각/우각 발생 시 중단 후 영상 확인을 통해 채팅 중단 시점부터 재RP 진행 가능 / 양측 협의 시 재알 가능</li><li>무력진압 후 사망할 경우, 소생 후 재참여 불가(소생된 경우, 사망자리에서 RP 종료까지 레그돌)</li><li>경찰은 F7 기준 인원으로 공표할 수 있으나, 팩션측에서는 무력진압 시작전 부재 인원에 대한 인원 정정을 요청할 수 있다.</li><li>차량 탑승 후 총기 발포와 볼링 행위 금지</li><li>사유지 범위 내부&gt;외부/외부&gt;내부 사격 금지 ( 사유지 범위는 건물이 아닌 전체 구역을 포함 )</li><li>건물 입구나 계단쪽 진입로에 공무원측은 건물 입구에 시체로 인해 진입이 어려울 경우, 중단한 후 사망 인원을 이동시킬 수 있다.</li><li>영장RP 진행시 사유지 내에 있는 모든 문 잠금을 해제한 상태로 진행하여야 한다.<br>ㄴ 사유지 버그로 인해 문이 안열리는 경우 미리 사전에 고지를 해야 하며 해당 자리는 사용 금지된다.</li><li>수배 → 영장 전환 후 준비시간 최대 20분 (초과시 패알처리)</li><li>영장은 중단 횟수 제한 없음</li></ul><hr>
<h2>3. 진행방법</h2><ul><li>공무원은 사유지에 도착하여 [RP 채팅]으로 영장 RP를 공표한다.(3회)</li><li>공표 후 팩션측 대표자는 사유지 밖으로 나와 영장을 확인한 후 협조 여부를 말한다.(협조 거부or승낙)</li><li>승낙 시 공무원에게 수배자 인계 및 RP 종료</li><li>협조 거부 시 대표자는 사유지안으로들어가고공무원은 사유지 앞에서 5분 대기 후 [RP 채팅]으로 인원과 사유지 무력 진압을 알리고 RP 구역으로 진입하면 RP가 시작된다.(최소 3번)</li></ul><hr>
<h2>4. RP 보상 및 벌금</h2><ul><li>강도 승리 : 범죄면책</li><li>강도 패배 : 팩션 참여 인원 인당 벌금 4억 / 구금 30분</li><li>참여자 전원 불법물건 및 착용무기 압수 / 최초 수배자 범죄 행위 가중처벌</li></ul>`
  };

  Object.entries(lawChildPages).forEach(([id, title]) => {
    PAGES.push({
      id,
      cat: '법률',
      title,
      eyebrow: '법률',
      body: lawChildBodies[id] || `<h2>${title}</h2>`
    });
  });

  const CATEGORIES = ['가이드', '법률'];

  const chevronDown = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>';
  const chevronRight = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"/></svg>';

  const sidebarNav = document.getElementById('sidebarNav');
  const contentEl = document.getElementById('content');

  function renderSidebar(){
    sidebarNav.innerHTML = CATEGORIES.map(cat => {
      const items = PAGES.filter(p => p.cat === cat && !p.id.includes('-child-'));
      const itemsHtml = items.map(p => {
        const isLaw = cat === '법률';
        const children = p.id === 'server-law' ? [
          '[ 보호구역 ]', '[ 제제법률 ]', '[ 통합 서버 법률 ]', '[ 팩션 통합법률 ]', '[ 뉴비보호 ]', '[ 통합 RP 법률 ]'
        ] : p.id === 'official-law' ? [
          '[ 공무원 헌 형법 ]', '[ 공무원 벌금표 ]'
        ] : p.id === 'org-rp-law' ? [
          '[ 조직 RP 기본법률 ]', '[ 지상 C ]', '[ 지상 D ]', '[ 남공게릴라 ]', '[ 사유지 게릴라 ]', '[ 카지노 게릴라 ]', '[ 밀공장 게릴라 ]'
        ] : p.id === 'rp-law' ? [
          '[ 빈집 ]', '[ ATM ]', '[ 편의점 ]', '[ 보석상 ]', '[ 남부은행 ]', '[ 북부은행 ]', '[ 닭공장 ]', '[ 도주 ]', '[ 즉흥 ]', '[ 수배 ]', '[ 영장 ]'
        ] : [];
        const childHtml = children.map((name, i) => `
          <button type="button" data-page="${p.id}-child-${i}">
            <span>${name}</span>
          </button>
        `).join('');
        return isLaw ? `
          <div class="nav-law-item" data-law-id="${p.id}">
            <button type="button" class="nav-law-title" data-page="${p.id}" aria-expanded="true">
              ${chevronDown}
              <span>${p.title}</span>
            </button>
            <div class="nav-law-sub-wrap"><div class="nav-sub">${childHtml}</div></div>
          </div>
        ` : `
          <button type="button" data-page="${p.id}">
            ${chevronRight}
            <span>${p.title}</span>
          </button>
        `;
      }).join('');
      return `
        <div class="nav-group" data-cat="${cat}">
          <button type="button" class="nav-group-title" data-toggle="${cat}" aria-expanded="true">
            ${chevronDown}
            <span>${cat}</span>
          </button>
          <div class="nav-sub-wrap"><div class="nav-sub">${itemsHtml}</div></div>
        </div>
      `;
    }).join('');

    sidebarNav.querySelectorAll('button[data-page]').forEach(btn => {
      btn.addEventListener('click', () => showPage(btn.getAttribute('data-page')));
    });

    sidebarNav.querySelectorAll('.nav-group-title').forEach(btn => {
      btn.addEventListener('click', () => {
        const group = btn.closest('.nav-group');
        const collapsed = group.classList.toggle('collapsed');
        btn.setAttribute('aria-expanded', String(!collapsed));
      });
    });

    sidebarNav.querySelectorAll('.nav-law-title').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const item = btn.closest('.nav-law-item');
        const collapsed = item.classList.toggle('collapsed');
        btn.setAttribute('aria-expanded', String(!collapsed));
        showPage(btn.getAttribute('data-page'));
      });
    });
  }

  function highlightActive(id){
    sidebarNav.querySelectorAll('button[data-page]').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-page') === id);
    });
  }

  function showPage(id){
    const page = PAGES.find(p => p.id === id);
    if(!page) return;
    contentEl.innerHTML = `
      <div class="eyebrow">${page.eyebrow || page.cat}</div>
      <h1>${page.title}</h1>
      <div class="body-text">${page.body}</div>
    `;
    highlightActive(id);
    closeSearch();
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
    history.replaceState(null, '', '#' + id);
  }

  function showHome(){
    contentEl.innerHTML = `
      <h1>돌핀 가이드</h1>
      <div class="body-text">좌측 메뉴에서 항목을 선택하세요.</div>
    `;
    highlightActive(null);
  }

  /* ---------------- 실시간 전문 검색 ---------------- */
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');
  const searchClear = document.getElementById('searchClear');
  const searchKbd = document.getElementById('searchKbd');

  function escapeRegExp(str){
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function escapeHtml(str){
    return str.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }

  function highlightText(text, query){
    const re = new RegExp('(' + escapeRegExp(query) + ')', 'ig');
    return escapeHtml(text).replace(re, '<mark>$1</mark>');
  }

  function buildSnippet(body, query){
    const plainBody = body.replace(/<[^>]*>/g, '');
    const idx = plainBody.toLowerCase().indexOf(query.toLowerCase());
    if(idx === -1){
      return highlightText(plainBody.slice(0, 70) + (plainBody.length > 70 ? '…' : ''), query);
    }
    const start = Math.max(0, idx - 30);
    const end = Math.min(plainBody.length, idx + query.length + 40);
    let snippet = plainBody.slice(start, end);
    if(start > 0) snippet = '…' + snippet;
    if(end < plainBody.length) snippet = snippet + '…';
    return highlightText(snippet, query);
  }

  function runSearch(query){
    query = query.trim();
    if(!query){
      searchResults.classList.remove('open');
      searchResults.innerHTML = '';
      return;
    }

    const q = query.toLowerCase();
    const matches = PAGES.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.cat.toLowerCase().includes(q) ||
      p.body.toLowerCase().includes(q)
    );

    if(matches.length === 0){
      searchResults.innerHTML = `<div class="sr-empty">"${escapeHtml(query)}"에 대한 검색 결과가 없습니다.</div>`;
      searchResults.classList.add('open');
      return;
    }

    searchResults.innerHTML = `
      <div class="sr-count">검색 결과 ${matches.length}건</div>
      ${matches.map(p => `
        <div class="sr-item" data-page="${p.id}">
          <div class="sr-cat">${p.cat}</div>
          <div class="sr-title">${highlightText(p.title, query)}</div>
          <div class="sr-snippet">${buildSnippet(p.body, query)}</div>
        </div>
      `).join('')}
    `;
    searchResults.classList.add('open');

    searchResults.querySelectorAll('.sr-item').forEach(el => {
      el.addEventListener('click', () => {
        showPage(el.getAttribute('data-page'));
        searchInput.value = '';
        searchClear.style.display = 'none';
        searchKbd.style.display = 'inline-block';
        closeSearch();
      });
    });
  }

  function closeSearch(){
    searchResults.classList.remove('open');
  }

  searchInput.addEventListener('input', (e) => {
    const val = e.target.value;
    searchClear.style.display = val ? 'flex' : 'none';
    searchKbd.style.display = val ? 'none' : 'inline-block';
    runSearch(val);
  });

  searchInput.addEventListener('focus', () => {
    if(searchInput.value.trim()) searchResults.classList.add('open');
  });

  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.style.display = 'none';
    searchKbd.style.display = 'inline-block';
    closeSearch();
    searchInput.focus();
  });

  document.addEventListener('click', (e) => {
    if(!e.target.closest('.search-wrap')) closeSearch();
  });

  document.addEventListener('keydown', (e) => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      searchInput.focus();
    }
    if(e.key === 'Escape'){
      closeSearch();
      searchInput.blur();
    }
  });

  /* ---------------- 테마 토글 ---------------- */
  const html = document.documentElement;
  document.querySelectorAll('[data-theme-btn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const theme = btn.getAttribute('data-theme-btn');
      html.setAttribute('data-theme', theme);
      document.querySelectorAll('[data-theme-btn]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  /* ---------------- 초기화 ---------------- */
  renderSidebar();
  const initialId = location.hash ? location.hash.slice(1) : null;
  if(initialId && PAGES.some(p => p.id === initialId)){
    showPage(initialId);
  } else {
    showHome();
  }
</script>

</body>
</html>
